<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario de Turnos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="panel configuracion">
      <h1>Calendario de Turnos</h1>

      <div class="fila">
        <label for="anio">Año</label>
        <input id="anio" type="number" min="2020" max="2100" value="2026" />
      </div>

      <div class="bloque">
        <div class="encabezado-bloque">
          <h2>Personas</h2>
          <button id="agregarPersona" class="btn secundario" type="button">+ Agregar persona</button>
        </div>
        <div id="listaPersonas" class="lista-personas"></div>
      </div>

      <div class="bloque">
        <div class="encabezado-bloque">
          <h2>Meses</h2>
          <div class="acciones-mini">
            <button id="todosMeses" class="btn mini" type="button">Todos</button>
            <button id="ningunMes" class="btn mini" type="button">Ninguno</button>
          </div>
        </div>
        <div id="selectorMeses" class="grid-meses"></div>
      </div>

      <div class="bloque">
        <div class="encabezado-bloque">
          <h2>Días de la semana</h2>
        </div>
        <div id="selectorDiasSemana" class="grid-dias-semana"></div>
      </div>

      <div class="acciones-principales">
        <button id="prepararDias" class="btn secundario grande" type="button">Elegir días específicos</button>
        <button id="generar" class="btn primario grande" type="button">Generar calendario</button>
      </div>

      <p id="mensaje" class="mensaje"></p>
    </section>

    <section id="panelDiasEspecificos" class="panel oculto">
      <div class="encabezado-bloque">
        <h2>Días específicos</h2>
        <button id="cerrarDias" class="btn mini" type="button">Cerrar</button>
      </div>
      <p class="ayuda">Destildá cualquier fecha que no quieras usar, por ejemplo feriados o jornadas sin turnos.</p>
      <div id="calendariosSeleccion" class="calendarios"></div>
    </section>

    <section class="panel resultado">
      <div class="encabezado-bloque">
        <h2>Calendario anual</h2>
        <button id="regenerar" class="btn secundario" type="button">Volver a generar</button>
      </div>
      <div id="resumen" class="resumen"></div>
      <div id="calendariosResultado" class="calendarios"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
